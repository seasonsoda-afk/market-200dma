name: Update market data

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Yahoo Finance daily closes
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.parse
          import datetime

          symbols = {
              "sp500": "^GSPC",
              "nasdaq100": "^NDX"
          }

          out = {
              "updated_at_utc": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              "markets": {}
          }

          for name, symbol in symbols.items():

              url = (
                  "https://query1.finance.yahoo.com/v8/finance/chart/"
                  + urllib.parse.quote(symbol)
                  + "?range=2y&interval=1d"
                  + "&events=history&includePrePost=false"
              )

              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(req, timeout=30) as r:
                  result = json.load(r)["chart"]["result"][0]

              timestamps = result["timestamp"]
              closes = result["indicators"]["quote"][0]["close"]

              rows = []

              for ts, close in zip(timestamps, closes):
                  if close is not None:
                      date = datetime.datetime.fromtimestamp(
                          ts,
                          datetime.timezone.utc
                      ).date().isoformat()

                      rows.append((date, close))

              if len(rows) < 200:
                  raise RuntimeError(
                      f"{symbol}: 200営業日分のデータがありません"
                  )

              # 直近確定終値
              date, close = rows[-1]

              # 直近200営業日の終値から200DMAを計算
              last200 = [x[1] for x in rows[-200:]]
              ma200 = sum(last200) / 200

              # 200DMAからの乖離率
              deviation = (close / ma200 - 1) * 100

              out["markets"][name] = {
                  "symbol": symbol,
                  "date": date,
                  "close": round(close, 6),
                  "ma200": round(ma200, 6),
                  "deviation_pct": round(deviation, 6)
              }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(
                  out,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update market data"
            git push
          fi
