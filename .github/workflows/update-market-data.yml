name: Update market data

on:
  schedule:
    - cron: "5 16 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update market history and DFF
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import json
          import os
          import tempfile
          import time
          import urllib.parse
          import urllib.request
          from bisect import bisect_right
          from pathlib import Path
          from zoneinfo import ZoneInfo

          HISTORY_FILE = Path("history.json")
          DATA_FILE = Path("data.json")
          NY = ZoneInfo("America/New_York")
          CHICAGO = ZoneInfo("America/Chicago")


          def now_utc():
              return dt.datetime.now(dt.timezone.utc)


          def fetch_text(url, retries=3, timeout=60):
              last_error = None
              for attempt in range(retries):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": "market-200dma-updater/1.0"},
                      )
                      with urllib.request.urlopen(request, timeout=timeout) as response:
                          return response.read().decode("utf-8")
                  except Exception as error:
                      last_error = error
                      print(f"Request failed ({attempt + 1}/{retries}): {error}")
                      if attempt + 1 < retries:
                          time.sleep(5)
              raise last_error


          def fetch_json(url):
              return json.loads(fetch_text(url))


          def atomic_json_write(path, payload):
              # Do not touch the checked-in file until all input validation and
              # calculations have succeeded; os.replace is atomic on the runner.
              with tempfile.NamedTemporaryFile(
                  mode="w", encoding="utf-8", dir=path.parent,
                  prefix=f".{path.name}.", suffix=".tmp", delete=False,
              ) as handle:
                  json.dump(payload, handle, ensure_ascii=False, indent=2)
                  handle.write("\n")
                  temp_name = handle.name
              os.replace(temp_name, path)


          def fetch_market_series(symbol, start_date):
              start = dt.datetime.combine(
                  start_date, dt.time.min, tzinfo=dt.timezone.utc
              )
              end = now_utc() + dt.timedelta(days=1)
              query = urllib.parse.urlencode({
                  "period1": int(start.timestamp()),
                  "period2": int(end.timestamp()),
                  "interval": "1d",
                  "events": "history",
                  "includePrePost": "false",
              })
              url = (
                  "https://query1.finance.yahoo.com/v8/finance/chart/"
                  + urllib.parse.quote(symbol, safe="")
                  + "?" + query
              )
              payload = fetch_json(url)
              results = payload.get("chart", {}).get("result") or []
              if not results:
                  raise RuntimeError(f"{symbol}: Yahoo Finance returned no chart data")
              result = results[0]
              timestamps = result.get("timestamp") or []
              quotes = result.get("indicators", {}).get("quote") or []
              closes = quotes[0].get("close") if quotes else []
              values = {}
              for timestamp, close in zip(timestamps, closes):
                  if close is None:
                      continue
                  date = dt.datetime.fromtimestamp(
                      timestamp, dt.timezone.utc
                  ).date().isoformat()
                  values[date] = float(close)
              if not values:
                  raise RuntimeError(f"{symbol}: Yahoo Finance returned no closes")
              return values


          def fetch_dff(start_date):
              end_date = now_utc().date() + dt.timedelta(days=1)
              query = urllib.parse.urlencode({
                  "id": "DFF", "cosd": start_date.isoformat(),
                  "coed": end_date.isoformat(),
              })
              text = fetch_text("https://fred.stlouisfed.org/graph/fredgraph.csv?" + query)
              values = {}
              for row in csv.DictReader(text.splitlines()):
                  date = row.get("observation_date")
                  value = row.get("DFF")
                  if date and value and value != ".":
                      values[date] = float(value)
              if not values:
                  raise RuntimeError("FRED returned no DFF observations")
              return values


          def wait_for_h15_release():
              # The scheduled run begins at 15:05 Chicago.  Do not request DFF
              # before the H.15 release window opens at 15:30 Chicago.
              current = now_utc().astimezone(CHICAGO)
              release = current.replace(hour=15, minute=30, second=0, microsecond=0)
              if current < release:
                  seconds = (release - current).total_seconds()
                  print(f"Waiting {seconds:.0f}s for the H.15 release window")
                  time.sleep(seconds)


          with HISTORY_FILE.open(encoding="utf-8") as handle:
              history = json.load(handle)
          with DATA_FILE.open(encoding="utf-8") as handle:
              prior_data = json.load(handle)

          original_rows = history.get("markets")
          if not isinstance(original_rows, list) or not original_rows:
              raise RuntimeError("history.json has no market history")
          if any(not isinstance(row, dict) or "date" not in row for row in original_rows):
              raise RuntimeError("history.json contains an invalid market row")

          rows_by_date = {row["date"]: dict(row) for row in original_rows}
          if len(rows_by_date) != len(original_rows):
              raise RuntimeError("history.json contains duplicate market dates")
          last_market_date = max(rows_by_date)
          first_market_date = min(rows_by_date)
          print(f"Existing last market date: {last_market_date}")

          # Market updates: retry only while no new common Yahoo daily date is
          # available. A run which starts after 17:00 ET gets exactly one check.
          start_date = dt.date.fromisoformat(last_market_date) + dt.timedelta(days=1)
          deadline = now_utc().astimezone(NY).replace(
              hour=17, minute=0, second=0, microsecond=0
          )
          after_deadline_at_start = now_utc().astimezone(NY) >= deadline
          market_data = None
          common_new_dates = []
          while True:
              sp500 = fetch_market_series("^GSPC", start_date)
              nasdaq100 = fetch_market_series("^NDX", start_date)
              market_data = {"sp500": sp500, "nasdaq100": nasdaq100}
              common_new_dates = sorted(
                  date for date in set(sp500) & set(nasdaq100)
                  if date > last_market_date
              )
              if common_new_dates:
                  break
              current_ny = now_utc().astimezone(NY)
              if after_deadline_at_start or current_ny >= deadline:
                  print("No new common Yahoo market date is available; preserving history")
                  break
              remaining = (deadline - current_ny).total_seconds()
              print("No new common date yet; retrying Yahoo in 5 minutes")
              time.sleep(min(300, max(0, remaining)))

          # DFF is independent of whether Yahoo yielded a new market date.
          wait_for_h15_release()
          dff_values = fetch_dff(dt.date.fromisoformat(first_market_date))
          dff_dates = sorted(dff_values)

          def dff_on_or_before(market_date):
              index = bisect_right(dff_dates, market_date) - 1
              if index < 0:
                  return None
              date = dff_dates[index]
              return date, dff_values[date]

          # Add every missed common market date. Existing prices and dates are
          # never changed; only DFF values are refreshed from FRED below.
          for date in common_new_dates:
              dff_match = dff_on_or_before(date)
              if dff_match is None:
                  print(f"Skipping {date}: no DFF observation on or before it")
                  continue
              rows_by_date[date] = {
                  "date": date,
                  "sp500_close": round(market_data["sp500"][date], 6),
                  "nasdaq100_close": round(market_data["nasdaq100"][date], 6),
                  "dff": round(dff_match[1], 6),
              }
              print(f"Added market date: {date}")

          all_rows = [rows_by_date[date] for date in sorted(rows_by_date)]
          dff_updates = 0
          for row in all_rows:
              dff_match = dff_on_or_before(row["date"])
              if dff_match is None:
                  continue
              refreshed = round(dff_match[1], 6)
              if row.get("dff") != refreshed:
                  row["dff"] = refreshed
                  dff_updates += 1

          latest = all_rows[-1]
          sp_values = [row["sp500_close"] for row in all_rows]
          ndx_values = [row["nasdaq100_close"] for row in all_rows]
          if len(sp_values) < 200 or len(ndx_values) < 200:
              raise RuntimeError("At least 200 market rows are required")
          sp_ma200 = sum(sp_values[-200:]) / 200
          ndx_ma200 = sum(ndx_values[-200:]) / 200
          latest_dff_date = dff_dates[-1]

          # Build complete replacement objects only after every remote read and
          # validation above has succeeded.
          history["markets"] = all_rows
          history["end_date"] = latest["date"]
          history["updated_at_utc"] = now_utc().isoformat()
          data = dict(prior_data)
          data["updated_at_utc"] = now_utc().isoformat()
          data["markets"] = {
              "sp500": {
                  "symbol": "^GSPC", "date": latest["date"],
                  "close": round(latest["sp500_close"], 6),
                  "ma200": round(sp_ma200, 6),
                  "deviation_pct": round((latest["sp500_close"] / sp_ma200 - 1) * 100, 6),
              },
              "nasdaq100": {
                  "symbol": "^NDX", "date": latest["date"],
                  "close": round(latest["nasdaq100_close"], 6),
                  "ma200": round(ndx_ma200, 6),
                  "deviation_pct": round((latest["nasdaq100_close"] / ndx_ma200 - 1) * 100, 6),
              },
          }
          data["dff"] = {
              "date": latest_dff_date,
              "value": round(dff_values[latest_dff_date], 6),
          }

          atomic_json_write(HISTORY_FILE, history)
          atomic_json_write(DATA_FILE, data)
          print(f"Market rows added: {len(common_new_dates)}; DFF rows refreshed: {dff_updates}")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update market history"
            git push
          fi

