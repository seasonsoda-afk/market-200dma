<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18202a">
<title>200DMA Monitor</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fa;color:#18202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
main{max-width:900px;margin:auto;padding:28px 16px 40px}
h1{margin:0;font-size:26px}.lead{margin:6px 0 24px;color:#6b7480;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border:1px solid #e2e6eb;border-radius:18px;padding:22px;box-shadow:0 5px 18px #00000008}
.name{font-size:19px;font-weight:750}.ticker{font-size:12px;color:#8a939d;margin-top:2px}
.values{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}
.label{font-size:12px;color:#707985}.value{font-size:25px;font-weight:750;margin-top:4px}
.box{background:#f1f4f7;border-radius:14px;padding:18px;text-align:center}
.boxlabel{font-size:12px;color:#69727d}.dev{font-size:43px;font-weight:850;margin:3px 0}
.status{font-size:13px;color:#59636e}
.bar{height:8px;background:#e4e8ec;border-radius:99px;margin-top:16px;position:relative}
.zero{position:absolute;left:50%;top:0;width:2px;height:100%;background:#8b949e}
.fill{height:100%;position:absolute;top:0;border-radius:99px}
button{margin-top:18px;border:0;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:700;background:#18202a;color:#fff;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.info{margin-top:18px;background:#fff;border:1px solid #e2e6eb;border-radius:14px;padding:15px;font-size:12px;line-height:1.75;color:#69727d}
.error{display:none;margin-top:14px;padding:13px;border-radius:10px;color:#9f1d16;background:#fff0ef;border:1px solid #f3c6c1;line-height:1.6}
@media(max-width:650px){main{padding:22px 12px}.grid{grid-template-columns:1fr}h1{font-size:23px}.value{font-size:22px}.dev{font-size:38px}}
</style>
</head>
<body>
<main>
<h1>200日移動平均モニター</h1>
<p class="lead">S&amp;P500 / NASDAQ100の現在値と200日移動平均からの乖離率</p>

<div class="grid">
<section class="card">
<div class="name">S&amp;P 500</div><div class="ticker">^GSPC</div>
<div class="values">
<div><div class="label">現在値</div><div class="value" id="sp-price">—</div></div>
<div><div class="label">200日移動平均</div><div class="value" id="sp-ma">—</div></div>
</div>
<div class="box">
<div class="boxlabel">200日移動平均からの乖離</div>
<div class="dev" id="sp-dev">—</div>
<div class="status" id="sp-status">取得中…</div>
<div class="bar"><div class="zero"></div><div class="fill" id="sp-fill"></div></div>
</div>
</section>

<section class="card">
<div class="name">NASDAQ 100</div><div class="ticker">^NDX</div>
<div class="values">
<div><div class="label">現在値</div><div class="value" id="nd-price">—</div></div>
<div><div class="label">200日移動平均</div><div class="value" id="nd-ma">—</div></div>
</div>
<div class="box">
<div class="boxlabel">200日移動平均からの乖離</div>
<div class="dev" id="nd-dev">—</div>
<div class="status" id="nd-status">取得中…</div>
<div class="bar"><div class="zero"></div><div class="fill" id="nd-fill"></div></div>
</div>
</section>
</div>

<button id="reload" onclick="loadData()">データを更新</button>
<div class="info">
<div id="updated">データ取得時刻：—</div>
<div>200日移動平均＝直近200営業日の終値の単純平均</div>
<div>乖離率＝（現在値 − 200日移動平均）÷ 200日移動平均 × 100</div>
<div>市場開場中はYahoo FinanceのregularMarketPrice、休場中は直近終値を使用します。</div>
</div>
<div class="error" id="error"></div>
</main>

<script>
"use strict";

const YAHOO = "https://query1.finance.yahoo.com/v8/finance/chart/";
const fmt = n => Number(n).toLocaleString("ja-JP",{maximumFractionDigits:2});

async function getYahoo(symbol){
  const target = YAHOO + encodeURIComponent(symbol) +
    "?range=2y&interval=1d&events=history&includePrePost=false";

  // GitHub Pagesから直接取得 → CORSプロキシの順にフォールバック
  const urls = [
    target,
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(target)
  ];

  let lastError = null;
  for(const url of urls){
    try{
      const res = await fetch(url,{cache:"no-store"});
      if(!res.ok) throw new Error("HTTP "+res.status);
      const json = await res.json();
      if(!json.chart || !json.chart.result || !json.chart.result[0]){
        throw new Error("Yahoo Financeから有効なデータが返りませんでした");
      }
      return json.chart.result[0];
    }catch(e){
      lastError = e;
    }
  }
  throw new Error(symbol+" のデータを取得できませんでした: "+(lastError?.message||"unknown error"));
}

async function getData(symbol){
  const res = await getYahoo(symbol);
  const quote = res.indicators.quote[0];
  const closes = quote.close.filter(v => Number.isFinite(v));

  if(closes.length < 200) throw new Error(symbol+" の200営業日分のデータがありません");

  const last200 = closes.slice(-200);
  const ma = last200.reduce((a,b)=>a+b,0)/200;

  const meta = res.meta || {};
  const latestClose = closes[closes.length-1];
  const price = Number.isFinite(meta.regularMarketPrice)
    ? meta.regularMarketPrice
    : latestClose;

  return {
    price,
    ma,
    dev:(price/ma-1)*100,
    marketTime: meta.regularMarketTime ? new Date(meta.regularMarketTime*1000) : null
  };
}

function render(prefix,d){
  document.getElementById(prefix+"-price").textContent=fmt(d.price);
  document.getElementById(prefix+"-ma").textContent=fmt(d.ma);

  const dev=d.dev;
  document.getElementById(prefix+"-dev").textContent=(dev>=0?"+":"")+dev.toFixed(2)+"%";

  let status;
  if(dev>=10) status="200日線を10%以上上回る";
  else if(dev>=5) status="200日線を5〜10%上回る";
  else if(dev>-5) status="200日線の±5%以内";
  else if(dev>-10) status="200日線を5〜10%下回る";
  else status="200日線を10%以上下回る";
  document.getElementById(prefix+"-status").textContent=status;

  const fill=document.getElementById(prefix+"-fill");
  const width=Math.min(Math.abs(dev),20)/20*50;
  fill.style.width=width+"%";
  fill.style.left=dev>=0?"50%":(50-width)+"%";
  fill.style.background=dev>=0?"#28784b":"#b42318";
}

async function loadData(){
  const btn=document.getElementById("reload");
  const err=document.getElementById("error");
  btn.disabled=true;
  err.style.display="none";
  document.getElementById("sp-status").textContent="取得中…";
  document.getElementById("nd-status").textContent="取得中…";

  try{
    const [sp,nd]=await Promise.all([getData("^GSPC"),getData("^NDX")]);
    render("sp",sp);
    render("nd",nd);

    const times=[sp.marketTime,nd.marketTime].filter(Boolean).map(d=>d.getTime());
    const marketText=times.length
      ? new Date(Math.max(...times)).toLocaleString("ja-JP")
      : "—";
    document.getElementById("updated").textContent=
      "データ取得時刻："+new Date().toLocaleString("ja-JP")+
      " ／ 市場データ時刻："+marketText;
  }catch(e){
    err.textContent=e.message+
      "。直接取得できない場合はCORSプロキシへ自動的に切り替えます。";
    err.style.display="block";
    document.getElementById("sp-status").textContent="取得できませんでした";
    document.getElementById("nd-status").textContent="取得できませんでした";
  }finally{
    btn.disabled=false;
  }
}

loadData();
</script>
</body>
</html>
